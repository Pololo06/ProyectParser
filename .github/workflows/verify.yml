name: Verify library and corpus
on: [push, pull_request]
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: mvn -B verify
      - name: Prepare corpus parser dependency
        shell: bash
        run: mvn -B -pl proyect-parser-core dependency:copy-dependencies -DincludeArtifactIds=javaparser-core "-DoutputDirectory=$PWD/proyect-parser-core/lib"
      - run: python -m unittest discover -s proyect-parser-core/tests -p "test_*.py"
      - run: python proyect-parser-core/tests/verificar_casos.py target/corpus
